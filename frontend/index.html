<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="description" content="Glob ERP - GST Compliant Fabrication Management" />
    <meta name="color-scheme" content="dark" />
    <!-- High refresh rate: force 60fps+ compositing -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Glob ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Critical CSS for instant load + smooth animations */
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #080b14; color: #f0f2f5; font-family: 'Inter', sans-serif; }
      #root { min-height: 100vh; }
      /* Prevent FOUC */
      .loading-screen {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; background: #080b14;
      }
      .loading-spinner {
        width: 40px; height: 40px; border: 3px solid rgba(6,182,212,0.2);
        border-top-color: #06b6d4; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen"><div class="loading-spinner"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
      // High refresh rate: use requestAnimationFrame for smooth updates
      // Prefers reduced motion check
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.style.setProperty('--animation-duration', '0s');
      }
    </script>
  </body>
</html>
