<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="description" content="Glob ERP - GST Compliant Fabrication Management" />
    <meta name="color-scheme" content="light dark" />
    <script>try { document.documentElement.classList.add(localStorage.getItem("glob-mode") === "light" ? "light-mode" : "dark-mode") } catch (e) { document.documentElement.classList.add("dark-mode") }</script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Glob ERP" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Glob ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--bg-primary, #080b14); color: var(--text-primary, #f0f2f5); font-family: 'Inter', sans-serif; }
      #root { min-height: 100vh; }
      .loading-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary, #080b14); }
      .loading-spinner { width: 40px; height: 40px; border: 3px solid rgba(6,182,212,0.2); border-top-color: #06b6d4; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
      function __off() {
        var b = document.getElementById('offline-bar');
        if (!b) { b = document.createElement('div'); b.id = 'offline-bar';
          b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;padding:6px 12px;text-align:center;font:600 12px Inter,sans-serif;background:#f59e0b;color:#111;padding-bottom:calc(6px + env(safe-area-inset-bottom))';
          b.textContent = 'Offline — viewing saved data (read-only)'; document.body.appendChild(b); }
        b.style.display = navigator.onLine ? 'none' : 'block';
      }
      window.addEventListener('online', __off); window.addEventListener('offline', __off);
      window.addEventListener('load', __off);
    </script>
  </head>
  <body>
    <div id="root"><div class="loading-screen"><div class="loading-spinner"></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
